# Tests on every push/PR. On pushes to main (and manual runs) it also builds a SIGNED release APK
# and publishes it as a GitHub Release.
# Latest download: https://github.com/Akrishna87/8zip/releases/latest/download/8zip.apk
#
# One-time setup: add the repository secret ANDROID_KEYSTORE_PASSWORD
# (Settings -> Secrets and variables -> Actions). The encrypted key is app/release.p12.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-35 build-tools;35.0.0" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: gradle :app:testDebugUnitTest --no-daemon

  release:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secret
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_PASSWORD repository secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools platforms;android-35 build-tools;35.0.0" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }

      - name: Check the password unlocks the keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          pw="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          if ! keytool -list -storetype pkcs12 -keystore app/release.p12 -storepass "$pw" >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD doesn't unlock app/release.p12 (secret is ${#pw} characters; it should be 32)."
            exit 1
          fi

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk 8zip.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 8zip-release-apk
          path: 8zip.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: 8zip 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: 8zip.apk
          body: |
            Install on Android: download **8zip.apk** below on your phone, open it, and allow installing from your browser when asked.
            Signed release build. Updates install over the previous version.
